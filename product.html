/* ===== Animated home hero slider ===== */
.hero-slider{height:min(780px,82vh);min-height:610px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cream2),var(--cream));isolation:isolate}
.hero-track,.hero-slide{position:absolute;inset:0}

.hero-slide.active{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto;z-index:2}
.hero-slide.leaving-left{opacity:0;visibility:visible;transform:translateX(-7%);z-index:1}.hero-slide.leaving-right{opacity:0;visibility:visible;transform:translateX(7%);z-index:1}
.hero-slide.entering-right{transform:translateX(7%)}.hero-slide.entering-left{transform:translateX(-7%)}
.hero-slide-inner{height:100%;display:grid;grid-template-columns:.92fr 1.08fr;align-items:center;gap:3vw;position:relative;z-index:2}
.hero-bg-shape{position:absolute;width:72vw;height:72vw;right:-21vw;top:-31vw;border:2px solid rgba(184,160,111,.45);border-radius:50%;z-index:0}.hero-bg-shape:after{content:'';position:absolute;inset:6%;border:1px solid rgba(184,160,111,.25);border-radius:50%}
.hero-copy-block{padding:55px 0 72px;position:relative;z-index:3}.hero-copy-block h1{font-size:clamp(3.3rem,6.4vw,6.6rem);line-height:.91;color:var(--green);margin:12px 0 24px;letter-spacing:-.045em}.hero-copy-block h1 span{color:var(--brown)}.hero-copy-block p{font-size:1.12rem;max-width:600px;color:#4e5a53}.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.hero-meta span{border:1px solid rgba(23,63,42,.14);background:rgba(255,255,255,.62);backdrop-filter:blur(8px);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--green);font-weight:700}
.hero-photo-wrap{height:88%;display:flex;align-items:center;justify-content:center;position:relative}.hero-photo-wrap img{width:100%;height:100%;object-fit:contain;object-position:center;position:relative;z-index:2;filter:drop-shadow(0 28px 28px rgba(23,63,42,.16));animation:plantFloat 5.5s ease-in-out infinite}.hero-photo-halo{position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(246,237,216,.22) 68%,transparent 70%);filter:blur(1px)}
.hero-slide.active .hero-animate{animation:heroTextIn .75s both}.hero-slide.active .hero-animate:nth-child(2){animation-delay:.08s}.hero-slide.active .hero-animate:nth-child(3){animation-delay:.16s}.hero-slide.active .hero-animate:nth-child(4){animation-delay:.24s}.hero-slide.active .hero-animate:nth-child(5){animation-delay:.32s}
.hero-arrow,.slider-arrow{position:absolute;z-index:8;border:1px solid rgba(23,63,42,.15);background:rgba(255,255,255,.76);backdrop-filter:blur(10px);color:var(--green);width:48px;height:48px;border-radius:50%;font-size:2rem;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.25s}.hero-arrow:hover,.slider-arrow:hover{background:var(--green);color:#fff;transform:scale(1.05)}.hero-prev{left:22px;top:50%}.hero-next{right:22px;top:50%}
.hero-dots{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:9;display:flex;gap:8px}.hero-dot{border:0;background:transparent;padding:6px;cursor:pointer;color:rgba(23,63,42,.45);font-weight:800;font-size:.72rem}.hero-dot:after{content:'';display:block;width:32px;height:3px;margin-top:3px;background:rgba(23,63,42,.18);transition:.3s}.hero-dot.active{color:var(--brown)}.hero-dot.active:after{background:var(--brown);width:54px}
.hero-progress{position:absolute;left:0;bottom:0;width:100%;height:3px;background:rgba(23,63,42,.08);z-index:10}.hero-progress span{display:block;height:100%;width:0;background:var(--brown)}
@keyframes heroProgress{from{width:0}to{width:100%}}@keyframes heroTextIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes plantFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.006)}}

/* ===== Moving collection slider ===== */
.slider{position:relative;overflow:hidden;border-radius:30px;box-shadow:var(--shadow);height:560px;background:#172f22}.collection-track{height:100%;display:flex;transition:transform .8s cubic-bezier(.22,.75,.2,1);will-change:transform}.collection-track .slide{position:relative;inset:auto;opacity:1;min-width:100%;height:100%;transition:none;overflow:hidden}.collection-track .slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s ease}.slider:hover .slide img{transform:scale(1.08)}.slider-prev{left:20px;top:50%;transform:translateY(-50%)}.slider-next{right:20px;top:50%;transform:translateY(-50%)}.slider-prev:hover,.slider-next:hover{transform:translateY(-50%) scale(1.05)}

/* ===== Scroll reveal ===== */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease var(--delay,0ms),transform .8s cubic-bezier(.22,.75,.2,1) var(--delay,0ms)}.reveal.revealed{opacity:1;transform:none}.category-card.revealed img{animation:gentleZoom 7s ease-out both}@keyframes gentleZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}
