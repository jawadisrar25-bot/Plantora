<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Plantora</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div data-header></div><main><section class="page-hero"><div class="container"><h1>Checkout</h1><p>Complete your details and send the order directly to Plantora on WhatsApp.</p></div></section><section class="section"><div class="container checkout-grid"><form class="form-card" id="checkoutForm"><h2>Delivery Details</h2><div class="form-grid"><div class="form-group"><label>Name</label><input class="input" name="name" required></div><div class="form-group"><label>Phone</label><input class="input" name="phone" required placeholder="+966..."></div><div class="form-group full"><label>Delivery Address</label><textarea class="input" name="address" rows="3" required></textarea></div><div class="form-group full"><label>Notes</label><textarea class="input" name="notes" rows="3"></textarea></div></div><button class="btn" type="submit">Place Order via WhatsApp</button><div id="success" class="notice" style="display:none;margin-top:15px">Order details were prepared and your cart has been saved as the latest order in this browser.</div></form><div class="summary-card"><h3>Your Order</h3><div id="checkoutSummary"></div><p style="font-size:.9rem;color:var(--muted)">Delivery fee and final availability are confirmed by Plantora.</p></div></div></section></main><div data-footer></div><script src="assets/js/products.js"></script><script src="assets/js/app.js"></script><script src="assets/js/checkout.js"></script></body></html>
